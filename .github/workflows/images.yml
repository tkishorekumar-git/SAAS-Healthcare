name: Images

# Builds the four production images for every commit on main, scans them, and pushes them to
# GitHub Container Registry tagged `sha-<commit>` (ADR-0006). Nothing is deployed here.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-server-config:
    name: Validate server configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Caddyfile parses and adapts
        run: >-
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro"
          -e KENISHA_APP_HOST=app.example.test -e KENISHA_API_HOST=api.example.test
          -e ACME_EMAIL=ops@example.test
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Compose file is valid
        run: |
          cp deploy/env/release.env.example /tmp/release.env
          sudo mkdir -p /etc/kenisha
          for f in api migrate postgres redis; do sudo cp "deploy/env/$f.env.example" "/etc/kenisha/$f.env"; done
          docker compose -f deploy/compose.yml --env-file /tmp/release.env config --quiet

      - name: Shell scripts pass ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0
          --severity=warning deploy/scripts/*.sh

  build:
    name: Build, scan and push (${{ matrix.target }})
    needs: validate-server-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [api, web, migrate, postgres]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kenisha-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # High and critical vulnerabilities with an available fix fail the build
      # (docs/security/scanning.md). The large migrate image is a short-lived job.
      - name: Scan image (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.57.1 image --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL --no-progress "$IMAGE:sha-${{ github.sha }}"

      - name: Push (main only)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:sha-${{ github.sha }}"
