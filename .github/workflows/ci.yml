name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-api:
    name: Web, API & packages
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Throwaway PostgreSQL for this job only. These credentials exist solely inside the
    # ephemeral CI container and are not secrets.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: kenisha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d kenisha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KENISHA_TEST_REDIS_URL: redis://localhost:6379/0
      DATABASE_ADMIN_URL: postgresql://ci_admin:ci-admin-password@localhost:5432/kenisha_ci
      MIGRATION_DATABASE_URL: postgresql://kenisha_migrator:ci-migrator-password@localhost:5432/kenisha_ci?schema=kenisha
      APP_DATABASE_URL: postgresql://kenisha_app:ci-app-password-1@localhost:5432/kenisha_ci?schema=kenisha
      PLATFORM_DATABASE_URL: postgresql://kenisha_platform:ci-platform-password@localhost:5432/kenisha_ci?schema=kenisha
      SEED_STAFF_PASSWORD: ci-seed-staff-password

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

      - name: Database — bootstrap roles, apply migrations, seed synthetic data
        run: |
          pnpm db:bootstrap
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Database — migrations must match schema.prisma (no drift)
        working-directory: packages/database
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Database — tenant isolation tests (RLS)
        run: pnpm test:db

      - name: API — login, session and permission flows against PostgreSQL and Redis
        run: pnpm test:e2e:db

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tools run from pinned container images: nothing is installed into the repository.
    # Policy and exceptions: docs/security/scanning.md (ADR-0005).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just this commit

      - name: Secrets — gitleaks over the full git history
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

      - name: Dependencies — known vulnerabilities (OSV) in the npm lockfile
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" ghcr.io/google/osv-scanner:v1.9.2
          --config=/src/osv-scanner.toml --lockfile=/src/pnpm-lock.yaml

      - name: Code — static analysis (Semgrep open-source rules)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src semgrep/semgrep:1.95.0
          semgrep scan --metrics=off --error --config p/typescript --config p/nodejs
          --config p/react --config p/secrets

  mobile:
    name: Flutter (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Dependencies — known vulnerabilities (OSV) in Dart packages
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/../..:/src" ghcr.io/google/osv-scanner:v1.9.2
          --config=/src/osv-scanner.toml --lockfile=/src/apps/mobile/pubspec.lock
