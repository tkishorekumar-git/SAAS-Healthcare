name: Deploy

# Started by hand. The `staging` GitHub environment must require your approval before this
# job runs (repository Settings > Environments). The server's forced SSH command runs only
# /opt/kenisha/bin/deploy.sh with the commit SHA (docs/security/runbooks/server-build.md).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA whose images passed the Images workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check the commit SHA
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full commit SHA"; exit 1; }'

      - name: Deploy over SSH
        env:
          SHA: ${{ inputs.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" "$SHA"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
