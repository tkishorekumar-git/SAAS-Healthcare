version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      nextjs:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
