# pgBackRest inside the PostgreSQL container (ADR-0006).
# The repository on this server is short-term; the backup VPS pulls it every 5 minutes and
# keeps the history (deploy/scripts/backup-pull.sh). The encryption passphrase comes from
# the environment (PGBACKREST_REPO1_CIPHER_PASS), never from this file.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[kenisha]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
